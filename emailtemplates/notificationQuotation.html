<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 1.5px solid #000;
            background-color: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #fff;
            padding: 20px;
        }
        .header-table {
            width: 100%;
            height: 80px;
            position: relative;
        }
        .header-logo {
            width: 50px;
            height: auto;
        }
        .header-right-image {
            width: 80px;
            height: auto;
            position: absolute;
            top: 0;
            right: 0;
        }
        .content {
            padding: 20px;
            text-align: left;
        }
        .content h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        .content p {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
            line-height: 1.5;
        }
        .content a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .highlight {
            background: #e3f2fd;
            padding: 15px;
            border-left: 4px solid #007bff;
            margin: 15px 0;
        }
        .btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 14px;
            font-weight: bold;
        }
        .footer {
            background-color: #f1f1f1;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>
<table class="email-container" cellpadding="0" cellspacing="0">
    <!-- Header Section -->
    <tr>
        <td class="header">
            <table class="header-table">
                <tr>
                    <td style="width: 50%; vertical-align: top;">
                        <img src="https://gmmnewerp.betaspace.dev/assets/img/branding/G-Logo.png" alt="GrandMaster Logo" class="header-logo" />
                    </td>
                    <td style="width: 50%; vertical-align: top; text-align: right;">
                        <img src="https://gmmnewerp.betaspace.dev/assets/img/branding/document_corner.png" alt="Notification Icon" class="header-right-image" />
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <!-- Content Section -->
    <tr>
        <td class="content">
            <p><strong>Hi {{RECIPIENT_NAME}},</strong></p>
            <h1>{{SUBJECT}}</h1>
            <div class="highlight">
                <p>{{MESSAGE}}</p>
            </div>
            <p style="text-align:center;">
                <!-- BULLETPROOF BUTTON -->
                <table border="0" cellspacing="0" cellpadding="0" align="center">
                    <tr>
                    <td bgcolor="#007bff" style="padding: 12px 24px; border-radius: 4px; text-align:center;">
                        <a href="{{LINK}}" 
                        style="font-size:14px; font-weight:bold; font-family: Arial, sans-serif; color:#ffffff; 
                                text-decoration:none; display:inline-block;">
                        View in ERP
                        </a>
                    </td>
                    </tr>
                </table>
                <!-- END BUTTON -->
            </p>
            <p>This is an automated notification from GrandMaster ERP. Please ignore if you've already seen this.</p>
        </td>
    </tr>
    <!-- Footer Section -->
    <tr>
        <td class="footer">
            <p>Thanks for choosing GrandMaster</p>
            <p>شكراً لاختياركم جراند ماستر</p>
            <p>© 2025 GrandMaster ERP. All rights reserved.</p>
        </td>
    </tr>
</table>
</body>
</html>
